<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <title>MQTT LED Pad</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { text-align: center; font-family: sans-serif; background: #121212; color: white; padding: 20px 10px; user-select: none; touch-action: none; }
        h1 { font-size: 20px; color: #00E676; margin-bottom: 15px; }
        .canvas-container { margin: 0 auto; width: 328px; height: 328px; }
        canvas { background: #222; border: 4px solid #333; border-radius: 12px; touch-action: none; }
        #status { margin-top: 15px; font-size: 12px; color: #888; }
        .modes { margin-bottom: 12px; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
        .modes button { background: #222; color: #ccc; border: 2px solid #333; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
        .modes button.active { border-color: #00E676; color: #00E676; }
        #clear { margin-top: 12px; background: #222; color: #FF5252; border: 2px solid #333; border-radius: 8px; padding: 8px 16px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>LED Pad</h1>

    <div class="modes">
        <button data-mode="trail" class="active">軌跡</button>
        <button data-mode="draw">お絵描き</button>
        <button data-mode="erase">消しゴム</button>
    </div>

    <div class="canvas-container">
        <canvas id="pad" width="320" height="320"></canvas>
    </div>
    <button id="clear">全部消す</button>
    <div id="status">MQTT接続中...</div>

    <script>
        const topic = "esp32/ledpad/draw/anatasikamienaino"; // ESP32側のトピックと合わせる
        // https のページ（GitHub Pages）からは暗号化された接続(wss)しか使えないので 8884 + SSL で接続
        const client = new Paho.MQTT.Client("broker.hivemq.com", 8884, "web_" + parseInt(Math.random() * 100000));
        const connectOptions = { useSSL: true, onSuccess: onConnect, onFailure: onConnectionLost };

        client.onConnectionLost = onConnectionLost;
        client.connect(connectOptions);

        function onConnect() {
            document.getElementById("status").innerText = "接続完了！";
            document.getElementById("status").style.color = "#00E676";
        }

        function onConnectionLost(responseObject) {
            document.getElementById("status").innerText = "接続が切れました。再接続中...";
            document.getElementById("status").style.color = "#FF5252";
            setTimeout(() => client.connect(connectOptions), 2000);
        }

        // キャンバス描画処理
        const canvas = document.getElementById('pad');
        const ctx = canvas.getContext('2d');
        const cols = 16; // 横16
        const rows = 16;  // 縦16
        const cellSize = canvas.width / cols;
        let isDrawing = false;
        let mode = 'trail'; // 'trail'（軌跡） / 'draw'（お絵描き） / 'erase'（消しゴム）
        let gridTime = Array(cols).fill().map(() => Array(rows).fill(0));
        let drawn = Array(cols).fill().map(() => Array(rows).fill(false));

        // モード切り替えボタン
        document.querySelectorAll('.modes button').forEach(btn => {
            btn.addEventListener('click', () => {
                mode = btn.dataset.mode;
                document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b === btn));
            });
        });

        // 全部消す
        document.getElementById('clear').addEventListener('click', () => {
            drawn = Array(cols).fill().map(() => Array(rows).fill(false));
            gridTime = Array(cols).fill().map(() => Array(rows).fill(0));
            sendMQTT('c');
        });

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const now = Date.now();

            for (let x = 0; x < cols; x++) {
                for (let y = 0; y < rows; y++) {
                    ctx.strokeStyle = '#333';
                    ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);

                    if (drawn[x][y] || now - gridTime[x][y] < 1000) {
                        ctx.fillStyle = '#00E676';
                        ctx.fillRect(x * cellSize + 2, y * cellSize + 2, cellSize - 4, cellSize - 4);
                    }
                }
            }
            requestAnimationFrame(drawGrid);
        }

        function handlePointer(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            // 枠線(border)の分を引いてからマス目に変換
            const x = Math.floor((clientX - rect.left - canvas.clientLeft) / cellSize);
            const y = Math.floor((clientY - rect.top - canvas.clientTop) / cellSize);

            if (x < 0 || x >= cols || y < 0 || y >= rows) return;

            if (mode === 'draw') {
                // すでに描いてあるマスは送り直さない
                if (!drawn[x][y]) {
                    drawn[x][y] = true;
                    sendMQTT(`d,${x},${y}`);
                }
            } else if (mode === 'erase') {
                if (drawn[x][y]) {
                    drawn[x][y] = false;
                    sendMQTT(`e,${x},${y}`);
                }
            } else {
                const now = Date.now();
                if (now - gridTime[x][y] > 100) {
                    gridTime[x][y] = now;
                    sendMQTT(`${x},${y}`);
                }
            }
        }

        function sendMQTT(payload) {
            if (client.isConnected()) {
                const message = new Paho.MQTT.Message(payload);
                message.destinationName = topic;
                client.send(message);
            }
        }

        canvas.addEventListener('pointerdown', (e) => { isDrawing = true; handlePointer(e); });
        canvas.addEventListener('pointermove', (e) => { if (isDrawing) handlePointer(e); });
        window.addEventListener('pointerup', () => { isDrawing = false; });

        drawGrid();
    </script>
</body>
</html>
